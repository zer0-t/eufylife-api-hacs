name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'version.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from version.txt
        id: version
        run: |
          VERSION=$(cat version.txt | tr -d '\n\r\t ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if tag exists
        id: tag_check
        run: |
          if git tag --list | grep -q "^v${{ steps.version.outputs.version }}$"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::warning::Tag v${{ steps.version.outputs.version }} already exists - skipping release creation"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::Tag v${{ steps.version.outputs.version }} does not exist - proceeding with release"
          fi

      - name: Generate changelog
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          # Get the latest stable tag. Pre-release tags sort above their own
          # stable tag (v2.3.0-beta1 > v2.3.0), so including them would cut the
          # changelog off at the beta and drop everything released with it.
          LATEST_TAG=$(git tag --sort=-version:refname | grep -vE '\-(alpha|beta|rc)' | head -n 1)

          # If no previous tag exists, use initial commit
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          # Generate changelog
          CHANGELOG=$(git log ${LATEST_TAG}..HEAD --pretty=format:"- %s" --no-merges)

          # If changelog is empty, provide a default message
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Version ${{ steps.version.outputs.version }} release"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # Build the notes in a file first: interpolating the changelog into a
          # heredoc here would let the shell expand any $ or ` that a commit
          # subject happens to contain.
          {
            printf '## Changes in v%s\n\n' "$VERSION"
            printf '%s\n\n' "$CHANGELOG"
            cat <<'NOTES'
          ## Installation

          ### HACS (Recommended)
          1. Have HACS installed
          2. In the HACS panel, go to "Integrations"
          3. Open the three-dot menu and choose "Custom repositories"
          4. Add this repository URL with category "Integration"
          5. Click the "+ EXPLORE & DOWNLOAD REPOSITORIES" button
          6. Search for "EufyLife API" and download this integration
          7. Restart Home Assistant
          8. Add the integration in the HA UI (Settings -> Devices & Services -> Add
             Integration -> "EufyLife API") and enter your EufyLife email, password
             and country there

          ### Manual Installation
          1. Download the latest release
          2. Extract the files to your `custom_components/eufylife_api/` directory
          3. Restart Home Assistant
          NOTES
          } > release-notes.md

          # Versions such as 2.4.0-beta1 are published as pre-releases.
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
            *)   PRERELEASE="" ;;
          esac

          # The runner ships the GitHub CLI, so the archived Node 12 action
          # (actions/create-release@v1) is no longer needed. With no --target,
          # the tag is created at the default branch's current commit.
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE
