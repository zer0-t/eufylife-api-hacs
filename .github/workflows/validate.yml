name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # No ignores: the repository ships its own brand images in
          # custom_components/eufylife_api/brand/ (which satisfies the "brands"
          # check), and the remaining checks - description, issues, topics,
          # hacsjson, integration_manifest - are all repository settings or files
          # that are in place. The topics are metadata rather than a file, so
          # they are set with the gear icon of the repository page's About panel
          # (or PUT /repos/OWNER/REPO/topics); the action picks them up on the
          # next run without a commit.
